name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # GitHub retains artifacts from earlier attempts of the same run.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - uses: ./.github/actions/setup-lui-ocaml
      # PRs restore read-only; only base-branch pushes save (repo cache is
      # capped at 10GB and per-PR dune caches were evicting the Windows opam switch).
      - name: Restore dune cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Install Web dependencies
        run: npm --prefix platform/web ci
      - name: Build Web stylesheet
        run: npm --prefix platform/web run build
      - name: Build production renderer and Gallery
        run: opam exec -- dune build @web
      - name: Assemble release site
        run: node tooling/build_web_release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _build/web-release
      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          : "${PAGES_ARTIFACT_ID:?The Pages upload did not return an artifact ID}"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME"
          for _ in {1..12}; do
            if artifact_ids=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ $artifact_ids == "$PAGES_ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages artifact $PAGES_ARTIFACT_NAME is not visible after upload."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Trim dune cache
        if: github.event_name == 'push'
        run: opam exec -- dune cache trim --size=400MB
      - name: Save dune cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

