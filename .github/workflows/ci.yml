name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lg-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve toolchain revisions
        id: revs
        env:
          LOGSEQ_GITHUB_PAT: ${{ secrets.LOGSEQ_GITHUB_PAT }}
        run: |
          git config --global url."https://x-access-token:${LOGSEQ_GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
          echo "lg=$(git ls-remote https://github.com/logseq/lg.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "signal_lg=$(git ls-remote https://github.com/logseq/signal-lg.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-5.5-${{ hashFiles('*.opam', 'dune-project') }}-${{ steps.revs.outputs.lg }}-${{ steps.revs.outputs.signal_lg }}
      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      # lg and signal-lg are private; pin-depends (melange-edn/transit)
      # are applied automatically by `opam install .`.
      - name: Checkout lg toolchain
        run: |
          git clone --depth 1 https://github.com/logseq/lg.git ~/lg
          git clone --depth 1 https://github.com/logseq/signal-lg.git ~/signal-lg
      - name: Install lg and lg-test
        run: |
          cd ~/lg
          opam install . --deps-only --with-test -y
          opam install . -y
      - name: Install signal-lg
        run: |
          cd ~/signal-lg
          opam install . --deps-only --with-test -y
          opam install . -y
      - name: Install lui dependencies
        run: opam install . --deps-only --with-test -y
      - name: Schema tests
        run: node --test tooling/test/*.mjs
      - name: LG tests
        run: opam exec -- dune build --action-stderr-on-success=must-be-empty @runtest

  apple-tests:
    # Package.swift requires swift-tools-version 6.2 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - run: swift test
