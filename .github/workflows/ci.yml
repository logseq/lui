name: CI

on:
  push:
    # feat/ml-backend is temporary: lets CI exercise the native backend on
    # this branch's pushes until it lands on main.
    branches: [main, feat/ml-backend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # feat/ml-backend: cancel stale push runs too — upstream lands commits
  # every few minutes, so a serialized queue just jams behind the oldest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/ml-backend' }}

jobs:
  ocaml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-lui-ocaml
      # PRs restore read-only; only base-branch pushes save (repo cache is
      # capped at 10GB and per-PR dune caches were evicting the Windows opam switch).
      - name: Restore dune cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Install fetch runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4
      - name: Build all OCaml targets
        run: opam exec -- dune build @all
      - name: Schema tests
        run: node --test tooling/test/*.mjs
      - name: OCaml tests
        run: make test-ocaml
      - name: Build portable OCaml bounded-row application
        run: bash tooling/test/build_bounded_virtual_fixture.sh "$RUNNER_TEMP/lui-bounded-native-fixture"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real JVM, JNI and OCaml bounded-row lifecycle
        run: python3 platform/android/test_native_virtual_rows.py "$RUNNER_TEMP/lui-bounded-native-fixture"
      - name: Runtime performance qualification
        run: bash tooling/performance/qualify_runtime.sh
      - name: Trim dune cache
        if: github.event_name == 'push'
        run: opam exec -- dune cache trim --size=400MB
      - name: Save dune cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - uses: ./.github/actions/setup-lui-ocaml
      # PRs restore read-only; only base-branch pushes save (repo cache is
      # capped at 10GB and per-PR dune caches were evicting the Windows opam switch).
      - name: Restore dune cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Cache node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: platform/web/node_modules
          key: web-deps-${{ runner.os }}-${{ hashFiles('platform/web/package-lock.json') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/web/package-lock.json') }}
      - name: Install Web dependencies
        run: |
          if [ "${{ steps.web-node-modules.outputs.cache-hit }}" != "true" ]; then
            npm --prefix platform/web ci
          fi
      # System libraries are not cacheable across hosted runners (fresh image
      # each run); browser binaries only download on a browser-cache miss.
      - name: Install Playwright system libraries
        run: node platform/web/node_modules/playwright/cli.js install-deps chromium firefox webkit
      - name: Install Playwright browsers
        run: node platform/web/node_modules/playwright/cli.js install chromium firefox webkit
      - name: Build production renderer and Gallery
        run: opam exec -- dune build @web
      - name: Web stylesheet and unit checks
        run: npm --prefix platform/web run check
      - name: Browser regressions
        run: |
          tests=()
          for file in platform/web/test/*.e2e.mjs; do
            if [[ "$file" != */hot-reload.e2e.mjs ]]; then
              tests+=("$file")
            fi
          done
          node --test --test-concurrency=2 "${tests[@]}"
      - name: Firefox and WebKit overlay ownership and virtual rows
        run: |
          for browser in firefox webkit; do
            LUI_WEB_BROWSER="$browser" node --test --test-name-pattern='^(owned picker|clicking an owned|removing a modal|nested modal locks|modal focus|rapidly reopened)' platform/web/test/overlay.e2e.mjs
            LUI_WEB_BROWSER="$browser" node --test platform/web/test/virtual-rows.e2e.mjs
          done
      - name: WebKit retained Gallery regressions
        run: LUI_WEB_BROWSER=webkit node --test platform/web/test/firefox.e2e.mjs
      # Hot reload edits shared sources and starts Dune, so it runs alone.
      - name: Hot reload regression
        run: node --test platform/web/test/hot-reload.e2e.mjs
      - name: Trim dune cache
        if: github.event_name == 'push'
        run: opam exec -- dune cache trim --size=400MB
      - name: Save dune cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  apple-tests:
    # Package.swift requires swift-tools-version 6.2 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - run: make test-apple
      - uses: ./.github/actions/setup-lui-ocaml
        with:
          scope: compiler
      - name: Install portable fixture dependencies
        run: opam install -y dune ppxlib ocaml-signal melange
      - name: Build portable OCaml bounded-row application
        run: bash tooling/test/build_bounded_virtual_fixture.sh "$RUNNER_TEMP/lui-bounded-native-fixture"
      - name: Actual OCaml and SwiftUI bounded-row lifecycle
        env:
          LUI_APPLE_BOUNDED_LIBRARY: ${{ runner.temp }}/lui-bounded-native-fixture/liblui_bounded_virtual.dylib
        run: swift test --filter LUISparseVirtualNativeTests
      - name: Compile iOS backend and tests
        run: >-
          xcodebuild -scheme LUI-Package
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/lui-ios-build"
          build-for-testing
      - name: Actual UIKit bounded-row lifecycle
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True))
          device = next(device for runtime, devices in data["devices"].items()
              if runtime.rsplit(".", 1)[-1].startswith("iOS-")
              for device in devices if device["name"].startswith("iPhone"))
          if device["state"] != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", device["udid"]], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", device["udid"], "-b"], check=True)
          subprocess.run([sys.executable, "platform/apple/Tests/RuntimeChecks/run-ios-check.py",
              "bounded-virtual-rows", "--simulator", device["udid"],
              "--diagnostics-dir", os.path.join(os.environ["RUNNER_TEMP"], "lui-uikit-diagnostics")], check=True)
          PYTHON
      - name: Preserve UIKit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uikit-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lui-uikit-diagnostics
          if-no-files-found: ignore

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - name: Android store and actual Compose regressions
        working-directory: platform/android
        run: ./gradlew --no-daemon :lui:testDebugUnitTest
      - name: Android Drive protocol, sample builds and scoped lint
        working-directory: platform/android
        run: >-
          ./gradlew --no-daemon
          :drive:testDebugUnitTest
          :drive-sample:assembleDebug :drive-sample:assembleRelease
          :drive:lintDebug :drive-sample:lintDebug :lui:lintDebug
      - name: Compile native Android Gallery host
        run: platform/android/gradlew --no-daemon -p examples/components/android :app:compileDebugKotlin

  c-bridge-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lui-ocaml
        with:
          scope: compiler
      - name: GC stress the native pointer bridge
        run: opam exec -- sh platform/bridge/stress/run.sh

  portable-services:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lui-ocaml
      - name: Build portable host services
        run: opam exec -- dune build platform/services/
      - name: Test portable host services
        run: opam exec -- dune runtest platform/services/ -j 1
