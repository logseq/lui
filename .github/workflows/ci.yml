name: CI

on:
  push:
    # feat/ml-backend is temporary: lets CI exercise the native backend on
    # this branch's pushes until it lands on main.
    branches: [main, feat/ml-backend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ocaml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-lui-ocaml
      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Install native platform dependencies
        run: |
          # platform/native joins @runtest on this branch: SDL2/SDL2_ttf
          # satisfy conf-sdl2(-ttf) for tsdl, the Pango/fontconfig headers
          # build lui_text_pango's stubs, and the dbus/GTK/appindicator
          # runtime libs are dlopen'd by the ax/shell stubs.
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev \
            libpango1.0-dev libcairo2-dev libfontconfig-dev \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev \
            mesa-vulkan-drivers fonts-liberation fonts-noto-cjk
          opam install -y tsdl tsdl-ttf tgls imagelib
      - name: Schema tests
        run: node --test tooling/test/*.mjs
      - name: GPUI protocol parity
        run: node tooling/generate_gpui_protocol_rules.mjs --check
      - name: OCaml tests
        run: opam exec -- dune build --action-stderr-on-success=must-be-empty @runtest
      - name: Runtime performance qualification
        run: bash tooling/performance/qualify_runtime.sh

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - uses: ./.github/actions/setup-lui-ocaml
      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Cache node_modules
        id: web-node-modules
        uses: actions/cache@v4
        with:
          path: platform/web/node_modules
          key: web-deps-${{ runner.os }}-${{ hashFiles('platform/web/package-lock.json') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/web/package-lock.json') }}
      - name: Install Web dependencies
        run: |
          if [ "${{ steps.web-node-modules.outputs.cache-hit }}" != "true" ]; then
            npm --prefix platform/web ci
          fi
      # System libraries are not cacheable across hosted runners (fresh image
      # each run); browser binaries only download on a browser-cache miss.
      - name: Install Playwright system libraries
        run: node platform/web/node_modules/playwright/cli.js install-deps chromium firefox webkit
      - name: Install Playwright browsers
        run: node platform/web/node_modules/playwright/cli.js install chromium firefox webkit
      - name: Build production renderer and Gallery
        run: opam exec -- dune build @web
      - name: Web stylesheet and unit checks
        run: npm --prefix platform/web run check
      - name: Browser regressions
        run: |
          tests=()
          for file in platform/web/test/*.e2e.mjs; do
            if [[ "$file" != */hot-reload.e2e.mjs ]]; then
              tests+=("$file")
            fi
          done
          node --test --test-concurrency=2 "${tests[@]}"
      - name: Firefox and WebKit overlay ownership
        run: |
          for browser in firefox webkit; do
            LUI_WEB_BROWSER="$browser" node --test --test-name-pattern='^(owned picker|clicking an owned|removing a modal|nested modal locks|modal focus|rapidly reopened)' platform/web/test/overlay.e2e.mjs
          done
      - name: WebKit retained Gallery regressions
        run: LUI_WEB_BROWSER=webkit node --test platform/web/test/firefox.e2e.mjs
      # Hot reload edits shared sources and starts Dune, so it runs alone.
      - name: Hot reload regression
        run: node --test platform/web/test/hot-reload.e2e.mjs

  apple-tests:
    # Package.swift requires swift-tools-version 6.2 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - run: swift test
      - name: Compile iOS backend and tests
        run: >-
          xcodebuild -scheme LUI-Package
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/lui-ios-build"
          build-for-testing

  cargo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/gpui -> target
          cache-on-failure: true
      - name: lui-core tests
        working-directory: platform/gpui
        run: cargo test -p lui-core --locked
      - name: Store performance qualification
        working-directory: platform/gpui
        run: cargo run -p lui-core --release --locked --example store_patch_bench

  gpui-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/gpui -> target
          cache-on-failure: true
      - name: GPUI renderer and core tests
        working-directory: platform/gpui
        run: cargo test -p lui-core -p lui-gpui --locked

  c-bridge-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lui-ocaml
        with:
          scope: compiler
      - name: GC stress the native pointer bridge
        run: opam exec -- sh platform/native/stress/run.sh

  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lui-ocaml
      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ github.job }}-
            dune-${{ runner.os }}-
      - name: Enable dune cache
        run: |
          echo "DUNE_CACHE=enabled" >> "$GITHUB_ENV"
          echo "DUNE_CACHE_TRANSPORT=direct" >> "$GITHUB_ENV"
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Same dep set as the ocaml-tests job: SDL2 >= 2.0.22 satisfies
          # tsdl (ubuntu-latest ships 2.30, so apt beats a source build),
          # Pango/fontconfig headers build lui_text_pango, and the rest are
          # runtime libs the ax/shell/vulkan stubs dlopen.
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev \
            libpango1.0-dev libcairo2-dev libfontconfig-dev \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev \
            mesa-vulkan-drivers fonts-liberation fonts-noto-cjk
          pkg-config --modversion sdl2 SDL2_ttf
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf pkgconf
      - name: Install OCaml native dependencies
        # tsdl provides the SDL2 bindings (lui_blit, lui_window*, spike,
        # lui_gl/parity tests), tgls the GL3 bindings (lui_gl), imagelib the
        # PNG/JPEG codecs (lui_image, lui_gallery). alcotest is already in
        # the locked deps but listed for the non-composite Windows path.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # On mingw, tsdl/tsdl-ttf resolve SDL2 through conf-sdl2(-ttf):
            # opam depext drops the Cygwin mingw64 SDL2 packages into
            # opam's bundled Cygwin sysroot during install. But pkgconf.exe
            # maps PKG_CONFIG_PATH against Git's MSYS root, not the opam
            # Cygwin root — pointing it at the sysroot still misses sdl2.pc.
            # The working recipe copies the .pc files into a plain Windows
            # dir and exports PKG_CONFIG_PATH in Windows form (verified on
            # the dev box). 'ocaml=5.5.1' stops the solver downgrading the
            # compiler on the mingw repo.
            if ! opam install -y 'ocaml=5.5.1' tsdl tsdl-ttf tgls imagelib alcotest; then
              OPAMROOT="$(opam var root)"
              SYSROOT="$(cygpath -u "$OPAMROOT")/.cygwin/root/usr/x86_64-w64-mingw32/sys-root/mingw"
              SRC_PC="$SYSROOT/lib/pkgconfig"
              [ -d "$SRC_PC" ] || SRC_PC="$(dirname "$(find "$(cygpath -u "$OPAMROOT")/.cygwin" -name 'sdl2.pc' | head -1)")"
              [ -f "$SRC_PC/sdl2.pc" ] || {
                echo "sdl2.pc not found under $OPAMROOT/.cygwin — depext did not deliver SDL2:"
                find "$(cygpath -u "$OPAMROOT")" -name '*.pc' 2>/dev/null | head -20
                exit 1
              }
              DST_PC="$(cygpath -u "$OPAMROOT")/sdl-pc"
              mkdir -p "$DST_PC"
              cp "$SRC_PC"/*.pc "$DST_PC"/
              export PKG_CONFIG_PATH="$(cygpath -w "$DST_PC")"
              opam install -y 'ocaml=5.5.1' tsdl tsdl-ttf tgls imagelib alcotest
            fi
            # SDL2.dll must be on PATH for the tests that call Sdl.init.
            echo "$(cygpath -w "$SYSROOT/bin")" >> "$GITHUB_PATH"
          else
            opam install -y tsdl tsdl-ttf tgls imagelib alcotest
          fi
      - name: Build platform/native
        run: opam exec -- dune build platform/native/
        shell: bash
      - name: Test platform/native
        # Tests skip what the runner cannot provide: no display -> GL/parity
        # skip, no dbus -> ax/shell skip, no lavapipe -> vulkan skip.
        run: opam exec -- dune runtest platform/native/ -f
        shell: bash
