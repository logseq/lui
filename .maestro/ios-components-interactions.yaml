    selected: true
- tapOn: "Components"
- scrollUntilVisible:
    element:
      id: "component-row-Checkbox"
    direction: DOWN
    speed: 80
    timeout: 30000
    centerElement: true
- tapOn:
    id: "component-row-Checkbox"
    point: "50%,90%"
- tapOn: "Enable notifications"
- tapOn: "Components"
- scrollUntilVisible:
    element:
      id: "component-row-Switch"
    direction: DOWN
    speed: 80
    timeout: 30000
    centerElement: true
- tapOn:
    id: "component-row-Switch"
    point: "50%,90%"
