      id: "component-row-Toggle"
    direction: DOWN
    speed: 80
    timeout: 30000
    centerElement: true
- tapOn:
    id: "component-row-Toggle"
    point: "50%,90%"
- assertVisible: "Bold formatting"
- tapOn: "Components"
- scrollUntilVisible:
