<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUI retained-layer regression fixture</title>
<link rel="stylesheet" href="/platform/web/dist/lui.css">
<script type="importmap">{"imports":{
"@tanstack/virtual-core": "/platform/web/dist/tanstack-virtual.js",
          "lui.web.dom/":"/_build/default/examples/components/web/lui-components-web/node_modules/lui.web.dom/",
"lui/":"/_build/default/examples/components/web/lui-components-web/node_modules/lui/",
"melange-webapi/":"/_build/default/examples/components/web/lui-components-web/node_modules/melange-webapi/",
"melange.dom/":"/_build/default/examples/components/web/lui-components-web/node_modules/melange.dom/",
"melange.js/":"/_build/default/examples/components/web/lui-components-web/node_modules/melange.js/",
"melange/":"/_build/default/examples/components/web/lui-components-web/node_modules/melange/",
"ocaml-signal/":"/_build/default/examples/components/web/lui-components-web/node_modules/ocaml-signal/"
}}</script>
<style>body{margin:24px;font:16px system-ui}#host{min-height:1400px}#host>.lui-column{position:sticky;top:0;z-index:1}button{margin:4px}.fixture-hidden{display:none}</style>
<h1>Retained layer regressions</h1>
<main id="host"></main>
<script type="module">
import * as Web from "lui.web.dom/shell/lui_web.js";
import { Protocol, properties as props, kinds } from "./protocol-fixture.mjs";
const host=document.querySelector("#host"), renderer=Web.create(undefined,host), backend=Web.backend(renderer);
const list=a=>a.reduceRight((tl,hd)=>({hd,tl}),0);
const nodes=new Map(),handlers=new Map(),events=[];let ops=[],generation=0,id=0,dialog=null,nestedDialog=null,menu=null,submenu=null,select=null,sheet=null,sheetInput=null;
const set=(n,name,value)=>ops.push(Protocol.set_prop_op(n,props.get(name),{TAG:typeof value==="string"?0:typeof value==="boolean"?1:2,_0:value}));
function node(kind,parent,p={}){const n=++id;ops.push(Protocol.create_node_op(n,kinds.get(kind)));nodes.set(n,{parent,children:[]});for(const [k,v]of Object.entries(p))set(n,k,v);if(parent){const siblings=nodes.get(parent).children;ops.push(Protocol.insert_child_op(parent,n,siblings.length));siblings.push(n);}return n;}
function flush(){if(ops.length){backend.apply_batch({generation:++generation,ops:list(ops)});ops=[];}}
function drop(n){if(!n||!nodes.has(n))return;for(const c of [...nodes.get(n).children])drop(c);const p=nodes.get(n).parent;if(p){ops.push(Protocol.remove_child_op(p,n));nodes.get(p).children=nodes.get(p).children.filter(x=>x!==n);}ops.push(Protocol.drop_node_op(n));nodes.delete(n);handlers.delete(n);}
function button(parent,text,fn){const n=node("button",parent,{text});handlers.set(n,fn);return n;}
function closeSubmenu(){if(submenu){drop(submenu);submenu=null;flush();}}
function closeMenu(){if(menu){drop(menu);menu=null;submenu=null;flush();}}
function openMenu(parent,picker){if(menu)return;select=picker;menu=node("dropdown-menu",parent,{"min-width":220});for(const text of ["Alpha","Beta","Gamma"]){const n=node("menu-item",menu,{text,"press-enabled":true});handlers.set(n,()=>{set(picker,"text",text);closeMenu();});}const more=node("menu-trigger",menu,{text:"More"});submenu=node("dropdown-menu",more,{"min-width":180});const nested=node("menu-trigger",submenu,{text:"Nested option"});const deep=node("dropdown-menu",nested,{"min-width":160});node("menu-item",deep,{text:"Deepest option","press-enabled":true});handlers.set(submenu,closeSubmenu);handlers.set(menu,closeMenu);flush();}
function picker(parent){const stack=node("stack",parent),s=node("select",stack,{text:"Alpha","press-enabled":true});handlers.set(s,()=>openMenu(stack,s));return s;}
function closeDialog(which="main"){const target=which==="nested"?nestedDialog:dialog;if(target){drop(target);if(which==="nested")nestedDialog=null;else{dialog=null;nestedDialog=null;menu=null;submenu=null;select=null;}flush();}}
function addScrollContent(parent){const scroller=node("scroll",parent,{height:120,width:300,"accessibility-identifier":"inner-scroll"});const content=node("column",scroller,{gap:8});node("text",content,{text:"Inner scroll start"});node("box",content,{height:480});node("text",content,{text:"Inner scroll end"});}
function closeSheet(){if(sheet){drop(sheet);sheet=null;sheetInput=null;if(window.audit)window.audit.sheetInput=null;flush();}}
function openSheet(){if(sheet)return;sheet=node("sheet",root,{text:"Regression sheet",height:320,padding:16});handlers.set(sheet,closeSheet);const body=node("column",sheet,{gap:12});node("paragraph",body,{text:"Sheet content stays in the retained renderer."});sheetInput=node("input",body,{placeholder:"Draft","accessibility-identifier":"sheet-input"});addScrollContent(body);node("box",body,{height:420});button(body,"Cancel",closeSheet);flush();if(window.audit)window.audit.sheetInput=document.querySelector("#sheet-input");}
function fastReopenDialog(){if(!dialog)return;const retained=dialog,index=nodes.get(root).children.indexOf(dialog);backend.apply_batch({generation:++generation,ops:list([Protocol.remove_child_op(root,retained)])});nodes.get(root).children.splice(index,1);backend.apply_batch({generation:++generation,ops:list([Protocol.insert_child_op(root,retained,index)])});nodes.get(root).children.splice(index,0,retained);}
function openDialog(mode="normal",parent=root,which="main"){const current=which==="nested"?nestedDialog:dialog;if(current)return;const d=node("dialog",parent,{text:which==="nested"?"Nested modal":"Layer regression dialog",width:440,height:420,padding:24});if(which==="nested")nestedDialog=d;else dialog=d;handlers.set(d,()=>closeDialog(which));if(mode!=="empty"){const c=node("column",d,{gap:16});if(mode==="focus"){node("link",c,{text:"Focus link",url:"https://example.com"});const hiddenGroup=node("column",c,{"style-class":"fixture-hidden"});const hidden=button(hiddenGroup,"Hidden candidate",()=>{});set(hidden,"accessibility-identifier","hidden-control");button(c,"Close dialog",()=>closeDialog(which));}else{node("input",c,{placeholder:"Dialog input"});picker(c);addScrollContent(c);if(which==="main"){button(c,"Open nested modal",()=>openDialog("empty",d,"nested"));button(c,"Reopen same dialog",fastReopenDialog);}button(c,"Close dialog",()=>closeDialog(which));}}flush();}
const root=node("column",null,{gap:18});
button(root,"Open dialog",()=>openDialog());
button(root,"Open focus dialog",()=>openDialog("focus"));
button(root,"Open empty dialog",()=>openDialog("empty"));
button(root,"Open regression sheet",openSheet);
Web.set_event_handler(renderer,e=>{events.push(e);if(e.TAG===0||e.TAG===7){handlers.get(e._0)?.();flush();}else if(e.TAG===2&&e._0===sheetInput){set(sheetInput,"text",e._1);flush();}return true;});
flush();Web.mount(renderer,root,host);
function setupTracking(count=4,tooltip=false){
  const scroller=node("column",root,{width:440,height:300,"style-class":"tracking-scroll"});
  const content=node("column",scroller,{"style-class":"tracking-content"});
  const spacer=node("box",content,{height:80});
  const stack=node("stack",content,{"style-class":"tracking-anchor"});
  const trigger=tooltip?button(stack,"Tracking tooltip",()=>{}):node("select",stack,{text:"Tracking select","press-enabled":true});
  let popup=null;
  function open(){if(popup)return;popup=node(tooltip?"tooltip":"dropdown-menu",stack,tooltip?{text:"Tracking tip",anchor:"below"}:{anchor:"below"});
    if(!tooltip)for(let i=0;i<count;i++){const item=node("menu-item",popup,{text:`Tracking option ${i}`,"press-enabled":true});handlers.set(item,close);}
    handlers.set(popup,close);flush();return popup;
  }
  function close(){if(popup){drop(popup);popup=null;flush();}}
  function retainReopen(){const n=popup,index=nodes.get(stack).children.indexOf(n);backend.apply_batch({generation:++generation,ops:list([Protocol.remove_child_op(stack,n),Protocol.insert_child_op(stack,n,index)])});}
  handlers.set(trigger,open);
  node("box",content,{height:900});flush();
  if(tooltip)open();
  window.audit.tracking={scroller,content,spacer,stack,trigger,open,close,retainReopen,
    resizeSpacer:height=>{set(spacer,"height",height);flush();},
    removeAnchor:()=>{drop(trigger);flush();}};
}
function setupContextTracking(){
  const host=node("list-item",root,{text:"Tracking context host","style-class":"tracking-context-host"});
  const menu=node("context-menu",host);let count=0;
  function grow(amount){for(let j=0;j<amount;j++){const index=count++,item=node("menu-item",menu,{text:`Context action ${index}`,"press-enabled":true});handlers.set(item,()=>window.audit.context.activations.push(index));}flush();}
  window.audit.context={host,menu,grow,activations:[],remove:()=>{drop(host);flush();}};
  grow(2);
}
window.audit={renderer,nodes,events,openDialog,closeDialog,setupTracking,setupContextTracking,openSheet,closeSheet,sheetInput:null};
</script>
