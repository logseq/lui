<style>body{margin:24px;font:16px system-ui}#host{min-height:1400px}#host>.lui-column{position:sticky;top:0;z-index:1}button{margin:4px}.fixture-hidden{display:none}.exit-audit-spinner{animation:exit-audit-spin 1s linear infinite}@keyframes exit-audit-spin{to{transform:rotate(360deg)}}</style>
<h1>Retained layer regressions</h1>
<button id="run-exit-audit">Run surface exit audit</button>

<script type="module">
import * as Web from "lui.web.dom/shell/lui_web.js";
import * as Menu from "lui.web.dom/popup/lui_web_menu.js";
import * as Overlay from "lui.web.dom/popup/lui_web_overlay.js";
import * as Layers from "lui.web.dom/core/lui_web_layers.js";
import { Protocol, properties as props, kinds } from "./protocol-fixture.mjs";
const host=document.querySelector("#host"), renderer=Web.create(undefined,host), backend=Web.backend(renderer);
const list=a=>a.reduceRight((tl,hd)=>({hd,tl}),0);
const nodes=new Map(),handlers=new Map(),events=[];let ops=[],generation=0,id=0,dialog=null,nestedDialog=null,menu=null,submenu=null,select=null,sheet=null,sheetInput=null;
const set=(n,name,value)=>ops.push(Protocol.set_prop_op(n,props.get(name),{TAG:typeof value==="string"?0:typeof value==="boolean"?1:2,_0:value}));
function node(kind,parent,p={}){const n=++id;ops.push(Protocol.create_node_op(n,kinds.get(kind)));nodes.set(n,{parent,children:[]});for(const [k,v]of Object.entries(p))set(n,k,v);if(parent){const siblings=nodes.get(parent).children;ops.push(Protocol.insert_child_op(parent,n,siblings.length));siblings.push(n);}return n;}
function flush(){if(ops.length){backend.apply_batch({generation:++generation,ops:list(ops)});ops=[];}}
function drop(n){if(!n||!nodes.has(n))return;for(const c of [...nodes.get(n).children])drop(c);const p=nodes.get(n).parent;if(p){ops.push(Protocol.remove_child_op(p,n));nodes.get(p).children=nodes.get(p).children.filter(x=>x!==n);}ops.push(Protocol.drop_node_op(n));nodes.delete(n);handlers.delete(n);}
function button(parent,text,fn){const n=node("button",parent,{text});handlers.set(n,fn);return n;}
function closeSubmenu(){if(submenu){drop(submenu);submenu=null;flush();}}
function closeMenu(){if(menu){drop(menu);menu=null;submenu=null;flush();}}
function openMenu(parent,picker){if(menu)return;select=picker;menu=node("dropdown-menu",parent,{"min-width":220});for(const text of ["Alpha","Beta","Gamma"]){const n=node("menu-item",menu,{text,"press-enabled":true});handlers.set(n,()=>{set(picker,"text",text);closeMenu();});}const more=node("menu-trigger",menu,{text:"More"});submenu=node("dropdown-menu",more,{"min-width":180});const nested=node("menu-trigger",submenu,{text:"Nested option"});const deep=node("dropdown-menu",nested,{"min-width":160});node("menu-item",deep,{text:"Deepest option","press-enabled":true});handlers.set(submenu,closeSubmenu);handlers.set(menu,closeMenu);flush();}
function picker(parent){const stack=node("stack",parent),s=node("select",stack,{text:"Alpha","press-enabled":true});handlers.set(s,()=>openMenu(stack,s));return s;}
function closeDialog(which="main"){const target=which==="nested"?nestedDialog:dialog;if(target){drop(target);if(which==="nested")nestedDialog=null;else{dialog=null;nestedDialog=null;menu=null;submenu=null;select=null;}flush();}}
function addScrollContent(parent){const scroller=node("scroll",parent,{height:120,width:300,"accessibility-identifier":"inner-scroll"});const content=node("column",scroller,{gap:8});node("text",content,{text:"Inner scroll start"});node("box",content,{height:480});node("text",content,{text:"Inner scroll end"});}
function closeSheet(){if(sheet){drop(sheet);sheet=null;sheetInput=null;if(window.audit)window.audit.sheetInput=null;flush();}}
function openSheet(){if(sheet)return;sheet=node("sheet",root,{text:"Regression sheet",height:320,padding:16});handlers.set(sheet,closeSheet);const body=node("column",sheet,{gap:12});node("paragraph",body,{text:"Sheet content stays in the retained renderer."});sheetInput=node("input",body,{placeholder:"Draft","accessibility-identifier":"sheet-input"});addScrollContent(body);node("box",body,{height:420});button(body,"Cancel",closeSheet);flush();if(window.audit)window.audit.sheetInput=document.querySelector("#sheet-input");}
function fastReopenDialog(){if(!dialog)return;const retained=dialog,index=nodes.get(root).children.indexOf(dialog);backend.apply_batch({generation:++generation,ops:list([Protocol.remove_child_op(root,retained)])});nodes.get(root).children.splice(index,1);backend.apply_batch({generation:++generation,ops:list([Protocol.insert_child_op(root,retained,index)])});nodes.get(root).children.splice(index,0,retained);}
function openDialog(mode="normal",parent=root,which="main"){const current=which==="nested"?nestedDialog:dialog;if(current)return;const d=node("dialog",parent,{...(mode.startsWith("untitled")?{}:{text:which==="nested"?"Nested modal":"Layer regression dialog"}),width:440,height:420,padding:24});if(which==="nested")nestedDialog=d;else dialog=d;handlers.set(d,()=>closeDialog(which));if(mode!=="empty"&&mode!=="untitled-empty"){const c=node("column",d,{gap:16});if(mode==="focus"){node("link",c,{text:"Focus link",url:"https://example.com"});const hiddenGroup=node("column",c,{"style-class":"fixture-hidden"});const hidden=button(hiddenGroup,"Hidden candidate",()=>{});set(hidden,"accessibility-identifier","hidden-control");button(c,"Close dialog",()=>closeDialog(which));}else{node("input",c,{placeholder:"Dialog input"});picker(c);addScrollContent(c);if(which==="main"){button(c,"Open nested modal",()=>openDialog("empty",d,"nested"));button(c,"Reopen same dialog",fastReopenDialog);}button(c,"Close dialog",()=>closeDialog(which));}}flush();}
const root=node("column",null,{gap:18});
button(root,"Open dialog",()=>openDialog());
button(root,"Open focus dialog",()=>openDialog("focus"));
button(root,"Open empty dialog",()=>openDialog("empty"));
button(root,"Open regression sheet",openSheet);
Web.set_event_handler(renderer,e=>{events.push(e);if(e.TAG===0||e.TAG===7){handlers.get(e._0)?.();flush();}else if(e.TAG===2&&e._0===sheetInput){set(sheetInput,"text",e._1);flush();}return true;});
flush();Web.mount(renderer,root,host);
function setupTracking(count=4,tooltip=false){
  const scroller=node("column",root,{width:440,height:300,"style-class":"tracking-scroll"});
  const content=node("column",scroller,{"style-class":"tracking-content"});
  const spacer=node("box",content,{height:80});
  const stack=node("stack",content,{"style-class":"tracking-anchor"});
  const trigger=tooltip?button(stack,"Tracking tooltip",()=>{}):node("select",stack,{text:"Tracking select","press-enabled":true});
  let popup=null;
  function open(){if(popup)return;popup=node(tooltip?"tooltip":"dropdown-menu",stack,tooltip?{text:"Tracking tip",anchor:"below"}:{anchor:"below"});
    if(!tooltip)for(let i=0;i<count;i++){const item=node("menu-item",popup,{text:`Tracking option ${i}`,"press-enabled":true});handlers.set(item,close);}
    handlers.set(popup,close);flush();return popup;
  }
  function close(){if(popup){drop(popup);popup=null;flush();}}
  function retainReopen(){const n=popup,index=nodes.get(stack).children.indexOf(n);backend.apply_batch({generation:++generation,ops:list([Protocol.remove_child_op(stack,n),Protocol.insert_child_op(stack,n,index)])});}
  handlers.set(trigger,open);
  node("box",content,{height:900});flush();
  if(tooltip)open();
  window.audit.tracking={scroller,content,spacer,stack,trigger,open,close,retainReopen,
    resizeSpacer:height=>{set(spacer,"height",height);flush();},
    removeAnchor:()=>{drop(trigger);flush();}};
}
function setupContextTracking(){
  const host=node("list-item",root,{text:"Tracking context host","style-class":"tracking-context-host"});
  const menu=node("context-menu",host);let count=0;
  function grow(amount){for(let j=0;j<amount;j++){const index=count++,item=node("menu-item",menu,{text:`Context action ${index}`,"press-enabled":true});handlers.set(item,()=>window.audit.context.activations.push(index));}flush();}
  window.audit.context={host,menu,grow,activations:[],remove:()=>{drop(host);flush();}};
  grow(2);
}
function addToast(text,duration=0){const toast=node("toast",root,{duration,padding:16});node("text",toast,{text});handlers.set(toast,()=>{drop(toast);flush();});flush();return toast;}
function openCover(name){const cover=node("popover",root);const body=node("column",cover,{padding:24,width:400});node("input",body,{placeholder:name,autofocus:true});handlers.set(cover,()=>{drop(cover);flush();});flush();return cover;}
function alignedOverlays(){for(const alignment of ['top-leading','top','top-trailing','leading','center','trailing','bottom-leading','bottom','bottom-trailing']){const overlay=node('overlay',root,{width:200,height:100,'accessibility-identifier':`overlay-${alignment}`});node('box',overlay,{width:200,height:100});node('box',overlay,{width:20,height:20,alignment});}flush();}
function togglePopover(){const stack=node('row',root);let popup=null;function close(){if(popup){drop(popup);popup=null;flush();}}button(stack,'Toggle anchored popup',()=>{if(popup){close();return;}popup=node('popover',stack,{anchor:'below'});node('text',popup,{text:'Anchored popup content'});handlers.set(popup,close);flush();});flush();}
window.audit={renderer,nodes,events,openDialog,closeDialog,setupTracking,setupContextTracking,openSheet,closeSheet,addToast,openCover,alignedOverlays,togglePopover,sheetInput:null};

const frames=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const finiteAnimations=el=>el.getAnimations().filter(a=>Number.isFinite(a.effect?.getComputedTiming().endTime));
async function runExitAudit(){
  const output=document.querySelector('#exit-audit-result'),results=[];
  output.textContent='Running';
  async function scenario(name,run){
    const checks=[];
    const check=(label,condition)=>checks.push({label,pass:!!condition});
    try{await run(check);}catch(error){checks.push({label:String(error._1??error),pass:false});}
    results.push({name,checks});
  }
  function surface(kind,transition){
    const holder=node('row',root);
    button(holder,'Exit audit anchor',()=>{});
    const n=node(kind,holder,{...(kind==='dialog'?{text:'Exit audit surface'}:{anchor:'below',transition}),width:240,height:120,
      'style-class':'exit-audit-surface'});
    node('paragraph',n,{text:'Exit audit content'});
    flush();
    const el=document.querySelector('.exit-audit-surface');
    if(kind==='dialog')el.style.transition=transition;
    return {n,holder,el};
  }
  async function settle(item){
    await frames();
    for(const animation of finiteAnimations(item.el))animation.finish();
    await frames();
  }
  function close(item){
    const backdrop=item.el.closest('.lui-modal-layer')?.querySelector('.lui-modal-backdrop');
    drop(item.n);flush();
    item.tracks=[...finiteAnimations(item.el),...(backdrop?finiteAnimations(backdrop):[])];
    for(const animation of item.tracks)animation.pause();
  }
  function finish(item,property){
    for(const animation of item.tracks){
      if(!property||animation.transitionProperty===property)animation.finish();
    }
  }
  function dispose(item){drop(item.holder);flush();}
  await scenario('popup waits for its longest track',async check=>{
    const item=surface('popover','opacity 60ms linear, transform 400ms linear');
    await settle(item);
    check('typed transition reaches the visual popup',getComputedStyle(item.el).transitionDuration==='0.06s, 0.4s');
    close(item);finish(item,'opacity');await frames();
    check('short opacity cannot remove the popup',item.el.isConnected);
    check('exiting popup is noninteractive',getComputedStyle(item.el).pointerEvents==='none');
    finish(item);await frames();check('popup releases after transform',!item.el.isConnected);dispose(item);
  });
  await scenario('modal waits for card and backdrop',async check=>{
    const item=surface('dialog','opacity 80ms linear, transform 400ms linear 100ms');
    await settle(item);close(item);finish(item,'opacity');await frames();
    check('card survives the shorter backdrop',item.el.isConnected);
    check('exiting modal is inert',item.el.hasAttribute('inert'));
    finish(item);await frames();check('modal releases after its delay and transform',!item.el.isConnected);dispose(item);
  });
  await scenario('zero motion has no fixed timeout',async check=>{
    const item=surface('popover','opacity 0ms, transform 0ms');
    await settle(item);close(item);await frames();
    check('zero duration releases on the next frame',!item.el.isConnected);dispose(item);
  });
  await scenario('cancelling one track still waits for another',async check=>{
    const item=surface('popover','opacity 200ms linear, transform 400ms linear');
    await settle(item);close(item);
    const opacity=item.tracks.find(a=>a.transitionProperty==='opacity');
    check('opacity transition exists',!!opacity);opacity?.cancel();await frames();
    check('cancellation cannot remove the other track',item.el.isConnected);
    finish(item);await frames();check('remaining transition releases the popup',!item.el.isConnected);dispose(item);
  });
  await scenario('reopen survives old completion and ignores child animation',async check=>{
    const item=surface('dialog','opacity 200ms linear, transform 200ms linear');
    const spinner=document.createElement('span');spinner.className='exit-audit-spinner';spinner.textContent='Spinner';item.el.append(spinner);
    await settle(item);
    const index=nodes.get(item.holder).children.indexOf(item.n);
    backend.apply_batch({generation:++generation,ops:list([Protocol.remove_child_op(item.holder,item.n)])});
    for(const animation of finiteAnimations(item.el))animation.pause();
    backend.apply_batch({generation:++generation,ops:list([Protocol.insert_child_op(item.holder,item.n,index)])});
    await settle(item);check('old close cannot remove the reopened dialog',item.el.isConnected&&!item.el.hasAttribute('data-ending-style'));
    close(item);finish(item);await frames();check('infinite child animation cannot retain the modal',!item.el.isConnected);dispose(item);
  });
  output.textContent=JSON.stringify({state:'Complete',pass:results.every(r=>r.checks.every(c=>c.pass)),results});
}
document.querySelector('#run-exit-audit').addEventListener('click',()=>{runExitAudit().catch(error=>{document.querySelector('#exit-audit-result').textContent=JSON.stringify({state:'Complete',pass:false,error:String(error)});});});
function runStyleAudit(){
  const results=[];
  for(const kind of ['popover','dropdown-menu','dialog']){
    const holder=node('row',root);
    button(holder,'Style audit anchor',()=>{});
    const className='motion-style-audit-'+kind;
    const n=node(kind,holder,{...(kind==='dialog'?{text:'Style audit dialog'}:{anchor:'below'}),width:240,height:120,'style-class':className});
    node(kind==='dropdown-menu'?'menu-item':'paragraph',n,{text:'Motion style content'});
    flush();
    const el=document.querySelector('.'+className),style=getComputedStyle(el);
    const scale=new DOMMatrixReadOnly(style.transform).a;
    const origin=style.transformOrigin.split(' ').map(parseFloat);
    const duration=kind==='dialog'?0.2:0.15,easing=kind==='dialog'?'ease-out':'ease';
    const checks=[
      {label:'declared default duration',pass:style.transitionDuration.split(',').every(v=>Math.abs(parseFloat(v)-duration)<0.00001)},
      {label:'declared default curve',pass:style.transitionTimingFunction.split(',').every(v=>v.trim()===easing)},
      {label:'entrance scale is 95 percent',pass:Math.abs(scale-0.95)<0.00001},
      {label:'zoom origin is centered',pass:Math.abs(origin[0]-el.offsetWidth/2)<0.51&&Math.abs(origin[1]-el.offsetHeight/2)<0.51}
    ];
    results.push({kind,scale,origin,duration:style.transitionDuration,easing:style.transitionTimingFunction,checks});
    drop(holder);flush();
  }
  document.querySelector('#style-audit-result').textContent=JSON.stringify({state:'Complete',pass:results.every(r=>r.checks.every(c=>c.pass)),results});
}
document.querySelector('#run-style-audit').addEventListener('click',runStyleAudit);

async function runInterruptionAudit(){
  const output=document.querySelector('#interruption-audit-result'),results=[];
  output.textContent='Running';
  async function scenario(name,run){
    const checks=[];
    const check=(label,condition)=>checks.push({label,pass:!!condition});
    try{await run(check);}catch(error){checks.push({label:String(error._1??error),pass:false});}
    results.push({name,checks});
  }
  function surface(kind,transition='opacity 200ms linear, transform 600ms linear'){
    const holder=kind==='context-menu'?node('list-item',root,{text:'Interruption context host'}):node('row',root);
    if(kind==='tooltip')button(holder,'Interruption anchor',()=>{});
    const n=node(kind,holder,kind==='tooltip'?{anchor:'below',text:'Interruption tip'}:{});
    if(kind==='context-menu')node('menu-item',n,{text:'Interruption action','press-enabled':true});
    flush();
    const el=document.querySelector('#lui-node-'+n);
    if(transition!==null)el.style.transition=transition;
    return {n,holder,el};
  }
  const open=item=>item.el.classList.contains('lui-tooltip')
    ?Overlay.set_tooltip_open(renderer,item.n,true):Menu.show_context_menu(renderer,item.n,80,180);
  const close=item=>item.el.classList.contains('lui-tooltip')
    ?Overlay.set_tooltip_open(renderer,item.n,false):Menu.hide_context_menu(renderer);
  const pause=item=>{item.tracks=finiteAnimations(item.el);for(const animation of item.tracks)animation.pause();};
  const finish=(item,property)=>{for(const animation of item.tracks??finiteAnimations(item.el))if(!property||animation.transitionProperty===property)animation.finish();};
  async function settle(item){await frames();finish(item);await frames();}
  function dispose(item){drop(item.holder);flush();}
  await scenario('context menu shares popup motion',async check=>{
    const item=surface('context-menu',null);
    open(item);
    const style=getComputedStyle(item.el),origin=style.transformOrigin.split(' ').map(parseFloat);
    check('context defaults use 150 ms ease',style.transitionDuration.split(',').every(v=>parseFloat(v)===0.15)
      &&style.transitionTimingFunction.split(',').every(v=>v.trim()==='ease'));
    check('context entrance uses the centered 95 percent zoom',new DOMMatrixReadOnly(style.transform).a===0.95
      &&Math.abs(origin[0]-item.el.offsetWidth/2)<0.51&&Math.abs(origin[1]-item.el.offsetHeight/2)<0.51);
    await settle(item);close(item);pause(item);
    check('context close retains visible inert content',item.el.hasAttribute('data-ending-style')
      &&item.el.hasAttribute('inert')&&getComputedStyle(item.el).display!=='none');
    finish(item);await frames();
    check('context close releases presentation and hides content',!Layers.is_present(renderer.web_layers,item.n)
      &&getComputedStyle(item.el).display==='none');
    dispose(item);
  });
  await scenario('context menu waits for all exit tracks',async check=>{
    const item=surface('context-menu');open(item);await settle(item);close(item);pause(item);
    check('context exit owns opacity and transform',item.tracks.length===2);
    finish(item,'opacity');await frames();
    check('short opacity cannot hide the pending transform',Layers.is_present(renderer.web_layers,item.n)
      &&item.el.hasAttribute('data-ending-style')&&getComputedStyle(item.el).display!=='none');
    finish(item);await frames();
    check('longest context track releases presentation',!Layers.is_present(renderer.web_layers,item.n)
      &&getComputedStyle(item.el).display==='none');dispose(item);
  });
  for(const kind of ['context-menu','tooltip']){
    await scenario(kind+' old close cannot finish a newer close',async check=>{
      const item=surface(kind);open(item);await settle(item);
      // An independent finite surface track survives CSS transition reversal.
      const previousMotion=item.el.animate([{filter:'blur(0px)'},{filter:'blur(1px)'}],{duration:1000});
      previousMotion.pause();close(item);pause(item);
      open(item);await frames();
      for(const animation of finiteAnimations(item.el))if(animation!==previousMotion)animation.finish();
      await frames();
      close(item);pause(item);await frames();
      previousMotion.finish();await frames();
      check('new exit still owns its pending tracks',item.tracks.length>0&&Layers.is_present(renderer.web_layers,item.n)
        &&item.el.hasAttribute('data-ending-style')&&getComputedStyle(item.el).display!=='none');
      finish(item);await frames();
      check('new exit eventually hides content',!Layers.is_present(renderer.web_layers,item.n)
        &&!item.el.hasAttribute('data-ending-style')&&getComputedStyle(item.el).display==='none');dispose(item);
    });
    await scenario(kind+' switching surfaces preserves the newer surface',async check=>{
      const first=surface(kind),second=surface(kind);open(first);await settle(first);
      open(second);pause(first);await settle(second);finish(first);await frames();
      check('previous surface settles without closing its replacement',!Layers.is_present(renderer.web_layers,first.n)
        &&Layers.is_open(renderer.web_layers,second.n)&&second.el.hasAttribute('data-open'));
      close(second);pause(second);finish(second);await frames();dispose(first);dispose(second);
    });
  }
  await scenario('zero duration context menu closes immediately',async check=>{
    const item=surface('context-menu','opacity 0ms, transform 0ms');open(item);await settle(item);close(item);await frames();
    check('zero motion leaves no presented menu',!Layers.is_present(renderer.web_layers,item.n)
      &&getComputedStyle(item.el).display==='none');dispose(item);
  });
  output.textContent=JSON.stringify({state:'Complete',pass:results.every(r=>r.checks.every(c=>c.pass)),results});
}
document.querySelector('#run-interruption-audit').addEventListener('click',()=>{runInterruptionAudit().catch(error=>{
  document.querySelector('#interruption-audit-result').textContent=JSON.stringify({state:'Complete',pass:false,error:String(error)});
});});
</script>
