<h1>Picker lifecycle regressions</h1>
<main id="host"></main>
<script type="module">
import * as Web from "lui.web.dom/shell/lui_web.js";
import * as Layers from "lui.web.dom/core/lui_web_layers.js";
import * as Schema from "lui/lui_wire_schema.js";

const host = document.querySelector("#host");
const renderer = Web.create(undefined, host);
const backend = Web.backend(renderer);
const list = values => values.reduceRight((tail, head) => ({ hd: head, tl: tail }), 0);
const props = new Map(Array.from({ length: 98 }, (_, index) => [Schema.property_name(index), index]));
const kinds = new Map(Array.from({ length: 86 }, (_, index) => [Schema.node_kind_name(index), index]));
const nodes = new Map();
const handlers = new Map();
const events = [];
const pickerKinds = new Map();
const pickerValues = new Map();
let ops = [];
let generation = 0;
let nextId = 0;
let menu = null;
let submenu = null;
let currentItems = [];
let activePicker = null;
let selectValue = "Beta";
let delayMount = false;
let pendingMount = false;
let pendingMountCallback = null;
let ignoreNextOpen = false;
let withSubmenu = false;

const set = (nodeId, name, value) => {
  const tag = typeof value === "string" ? 0 : typeof value === "boolean" ? 1 : 2;
  ops.push({ TAG: 3, _0: nodeId, _1: props.get(name), _2: { TAG: tag, _0: value } });
};

function node(kind, parent, properties = {}) {
  const nodeId = ++nextId;
  ops.push({ TAG: 0, _0: nodeId, _1: kinds.get(kind) });
  nodes.set(nodeId, { parent, children: [] });
  for (const [name, value] of Object.entries(properties)) set(nodeId, name, value);
  if (parent) {
    const siblings = nodes.get(parent).children;
    ops.push({ TAG: 7, _0: parent, _1: nodeId, _2: siblings.length });
    siblings.push(nodeId);
  }
  return nodeId;
}

function flush() {
  if (!ops.length) return;
  backend.apply_batch({ generation: ++generation, ops: list(ops) });
  ops = [];
}

function drop(nodeId) {
  if (!nodeId || !nodes.has(nodeId)) return;
  for (const child of [...nodes.get(nodeId).children]) drop(child);
  const parent = nodes.get(nodeId).parent;
  if (parent) {
    ops.push({ TAG: 8, _0: parent, _1: nodeId });
    nodes.get(parent).children = nodes.get(parent).children.filter(child => child !== nodeId);
  }
  ops.push({ TAG: 2, _0: nodeId });
  nodes.delete(nodeId);
  handlers.delete(nodeId);
}

function button(parent, text, identifier, handler = () => {}) {
  const nodeId = node("button", parent, { text, "accessibility-identifier": identifier });
  handlers.set(nodeId, handler);
  return nodeId;
}

function closeMenu() {
  if (!menu) return;
  drop(menu);
  menu = null;
  submenu = null;
  activePicker = null;
  currentItems = [];
  flush();
}

function addItem(parent, text, options = {}) {
  const nodeId = node("menu-item", parent, {
    text,
    enabled: options.enabled !== false,
    "press-enabled": true,
    selected: options.selected === true,
  });
  const item = { id: nodeId, text, enabled: options.enabled !== false };
  currentItems.push(item);
  handlers.set(nodeId, () => {
    if (!item.enabled) return;
    if (pickerKinds.get(activePicker) === "select") {
      selectValue = text;
      pickerValues.set(activePicker, text);
      set(activePicker, "text", text);
      for (const option of currentItems) set(option.id, "selected", option.id === nodeId);
    } else {
      pickerValues.set(activePicker, text);
      set(activePicker, "text", text);
    }
    closeMenu();
  });
  return nodeId;
}

function mountMenu(picker) {
  pendingMount = false;
  pendingMountCallback = null;
  if (menu) return;
  activePicker = picker;
  const pickerKind = pickerKinds.get(picker);
  const parent = nodes.get(picker).parent;
  menu = node(
    "dropdown-menu",
    parent,
    pickerKind === "combobox" ? { "style-class": "picker-long-menu" } : {},
  );
  currentItems = [];
  if (pickerKind === "select") {
    for (const text of ["Alpha", "Beta", "Charlie", "Delta", "Disabled"]) {
      addItem(menu, text, { enabled: text !== "Disabled", selected: text === pickerValues.get(picker) });
    }
    if (withSubmenu) {
      const trigger = node("menu-trigger", menu, { text: "More" });
      submenu = node("dropdown-menu", trigger, { "min-width": 180 });
      node("menu-item", submenu, { text: "Nested option", "press-enabled": true });
      handlers.set(trigger, () => {});
    }
  } else {
    for (let index = 0; index < 36; index++) {
      addItem(menu, `Option ${String(index).padStart(2, "0")}`, { selected: index === 0 });
    }
  }
  handlers.set(menu, closeMenu);
  flush();
}

function openMenu(picker) {
  if (menu || pendingMount) return;
  if (delayMount) {
    delayMount = false;
    pendingMount = true;
    pendingMountCallback = () => mountMenu(picker);
  } else {
    mountMenu(picker);
  }
}

function picker(parent, kind, identifier, properties = {}) {
  const stack = node("stack", parent);
  const nodeId = node(kind, stack, {
    "accessibility-identifier": identifier,
    "press-enabled": true,
    ...properties,
  });
  pickerKinds.set(nodeId, kind);
  pickerValues.set(nodeId, properties.text ?? "");
  handlers.set(nodeId, () => openMenu(nodeId));
  return nodeId;
}

function setProperty(nodeId, name, value) {
  set(nodeId, name, value);
  flush();
}

const root = node("column", null, { gap: 16 });
button(root, "Before picker", "picker-before");
const selectId = picker(root, "select", "picker-select", { text: selectValue, placeholder: "Choose an option" });
button(root, "After picker", "picker-after");
button(root, "Outside target", "picker-outside");
const comboId = picker(root, "combobox", "picker-combo", { text: "", placeholder: "Search options" });
button(root, "Open dialog", "picker-open-dialog", () => openDialog());
let dialogId = null;

function openDialog() {
  if (dialogId) return;
  dialogId = node("dialog", root, { text: "Picker owner dialog", width: 440, height: 360, padding: 24 });
  const column = node("column", dialogId, { gap: 16 });
  button(column, "Before dialog picker", "dialog-before");
  picker(column, "select", "dialog-select", { text: "Beta" });
  button(column, "After dialog picker", "dialog-after");
  button(column, "Close dialog", "dialog-close", () => closeDialog());
  flush();
}

function closeDialog() {
  if (!dialogId) return;
  drop(dialogId);
  dialogId = null;
  flush();
}

Web.set_event_handler(renderer, event => {
  events.push(event);
  if (event.TAG === 0 && ignoreNextOpen) {
    ignoreNextOpen = false;
  } else if (event.TAG === 0 || event.TAG === 7) {
    handlers.get(event._0)?.();
    flush();
  }
  return true;
});

flush();
Web.mount(renderer, root, host);
window.audit = {
  events,
  nodes,
  selectId,
  comboId,
  get menuItems() {
    return currentItems.map(({ id, text, enabled }) => ({ id, text, enabled }));
  },
  clearEvents() {
    events.length = 0;
  },
  openDialog,
  closeDialog,
  setSelectText(value) {
    selectValue = value;
    pickerValues.set(selectId, value);
    setProperty(selectId, "text", value);
  },
  setEnabled(nodeId, value) {
    setProperty(nodeId, "enabled", value);
  },
  setText(nodeId, value) {
    setProperty(nodeId, "text", value);
  },
  setPlaceholder(nodeId, value) {
    setProperty(nodeId, "placeholder", value);
  },
  setAccessibilityLabel(nodeId, value) {
    setProperty(nodeId, "accessibility-label", value);
  },
  delayNextMount() {
    delayMount = true;
  },
  finishPendingMount() {
    pendingMountCallback?.();
  },
  ignoreNextOpen() {
    ignoreNextOpen = true;
  },
  enableSubmenu() {
    withSubmenu = true;
  },
  insertComboOption(index, text) {
    if (!menu) return;
    const nodeId = node("menu-item", null, { text, enabled: true, "press-enabled": true });
    nodes.get(nodeId).parent = menu;
    nodes.get(menu).children.splice(index, 0, nodeId);
    ops.push({ TAG: 7, _0: menu, _1: nodeId, _2: index });
    currentItems.splice(index, 0, { id: nodeId, text, enabled: true });
    handlers.set(nodeId, () => {
      pickerValues.set(activePicker, text);
      set(activePicker, "text", text);
      closeMenu();
    });
    flush();
  },
  removeComboOption(index) {
    const item = currentItems[index];
    if (!item) return;
    drop(item.id);
    currentItems.splice(index, 1);
    flush();
  },
  disableComboOption(text) {
    const item = currentItems.find(candidate => candidate.text === text);
    if (!item) return;
    item.enabled = false;
    set(item.id, "enabled", false);
    flush();
  },
  disableAllComboOptions() {
    for (const item of currentItems) {
      item.enabled = false;
      set(item.id, "enabled", false);
    }
    flush();
  },
  isMenuMounted() {
    return menu !== null;
  },
  hasDialog() {
    return dialogId !== null;
  },
  submenuPresent() {
    return submenu !== null && Layers.is_present(renderer.web_layers, submenu);
  },
};
</script>
