function picker(parent,kind,identifier,props={}){const stack=node("stack",parent);const n=node(kind,stack,{"accessibility-identifier":identifier,"press-enabled":true,...props});pickerKinds.set(n,kind);pickerValues.set(n,props.text??"");handlers.set(n,()=>openMenu(n));return n;}
function setProperty(n,name,value){set(n,name,value);flush();}
const root=node("column",null,{gap:16});
button(root,"Before picker","picker-before");
const selectId=picker(root,"select","picker-select",{text:selectValue});
button(root,"After picker","picker-after");
button(root,"Outside target","picker-outside");
const comboId=picker(root,"combobox","picker-combo",{text:"",placeholder:"Search options"});
button(root,"Open dialog","picker-open-dialog",()=>openDialog());
let dialogId=null;
function openDialog(){if(dialogId)return;dialogId=node("dialog",root,{text:"Picker owner dialog",width:440,height:360,padding:24});const column=node("column",dialogId,{gap:16});picker(column,"select","dialog-select",{text:"Beta"});button(column,"Close dialog","dialog-close",()=>closeDialog());flush();}
function closeDialog(){if(!dialogId)return;drop(dialogId);dialogId=null;flush();}
Web.set_event_handler(renderer,e=>{events.push(e);if(e.TAG===0||e.TAG===7){handlers.get(e._0)?.();flush();}return true;});
flush();Web.mount(renderer,root,host);
window.audit={events,nodes,selectId,comboId,get menuItems(){return currentItems.map(({id,text,enabled})=>({id,text,enabled}));},clearEvents(){events.length=0;},openDialog,closeDialog,setSelectText(value){selectValue=value;setProperty(selectId,"text",value);},setEnabled(n,value){setProperty(n,"enabled",value);},setText(n,value){setProperty(n,"text",value);},setAccessibilityLabel(n,value){setProperty(n,"accessibility-label",value);},delayNextMount(){delayMount=true;},enableSubmenu(){withSubmenu=true;},insertComboOption(index,text){const before=currentItems[index]?.id;const parent=menu;if(!parent)return;const n=node("menu-item",parent,{text,enabled:true,"press-enabled":true});const siblings=nodes.get(parent).children;siblings.pop();const insertAt=before?siblings.indexOf(before):siblings.length;ops.push({TAG:8,_0:parent,_1:n});siblings.splice(insertAt,0,n);ops.push({TAG:7,_0:parent,_1:n,_2:insertAt});for(let i=insertAt+1;i<siblings.length;i++)ops.push({TAG:7,_0:parent,_1:siblings[i],_2:i});currentItems.splice(index,0,{id:n,text,enabled:true});handlers.set(n,()=>{if(selectValue!==null){selectValue=text;set(selectId,"text",text);}else set(comboId,"text",text);closeMenu();});flush();},removeComboOption(index){const item=currentItems[index];if(!item)return;drop(item.id);currentItems.splice(index,1);flush();},disableComboOption(text){const item=currentItems.find(x=>x.text===text);if(item){item.enabled=false;set(item.id,"enabled",false);flush();}},disableAllComboOptions(){for(const item of currentItems){item.enabled=false;set(item.id,"enabled",false);}flush();},isMenuMounted(){return menu!==null;},hasDialog(){return dialogId!==null;}};
Object.assign(window.audit,{selectId,comboId,get menuItems(){return currentItems.map(({id,text,enabled})=>({id,text,enabled}));},clearEvents(){events.length=0;},setSelectText(value){selectValue=value;pickerValues.set(selectId,value);setProperty(selectId,"text",value);},setEnabled(n,value){setProperty(n,"enabled",value);},setText(n,value){setProperty(n,"text",value);},setAccessibilityLabel(n,value){setProperty(n,"accessibility-label",value);},delayNextMount(){delayMount=true;},enableSubmenu(){withSubmenu=true;},insertComboOption(index,text){const parent=menu;if(!parent)return;const n=node("menu-item",null,{text,enabled:true,"press-enabled":true});nodes.get(n).parent=parent;nodes.get(parent).children.splice(index,0,n);ops.push({TAG:7,_0:parent,_1:n,_2:index});currentItems.splice(index,0,{id:n,text,enabled:true});handlers.set(n,()=>{pickerValues.set(activePicker,text);set(activePicker,"text",text);closeMenu();});flush();},removeComboOption(index){const item=currentItems[index];if(!item)return;drop(item.id);currentItems.splice(index,1);flush();},disableComboOption(text){const item=currentItems.find(x=>x.text===text);if(item){item.enabled=false;set(item.id,"enabled",false);flush();}},disableAllComboOptions(){for(const item of currentItems){item.enabled=false;set(item.id,"enabled",false);}flush();},isMenuMounted(){return menu!==null;},hasDialog(){return dialogId!==null;}});
