[package]
name = "lui-nsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
nsh-core = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936" }
nsh-base = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }
nsh-engine = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }
nsh-updater = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936" }
ureq = { version = "3.5.1", features = ["platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }

[dev-dependencies]
nsh-testing = { git = "https://github.com/logseq/nsh", rev = "d21573c25984e9603bf878ae8bb73c1e23408936", default-features = false }
